<div style="background-color: #eef3ff" class="mt-5 p-3">
  <div *ngIf="showTable" class="product-table-container">
    <mat-card class="product-table-card">
      <div class="table-header">
        <h2>📦 Product Details</h2>
      </div>

      <app-search-bar
        displayMsg="Search any product"
        (search)="searchByKeyword($event)"
      ></app-search-bar>

      <table
        mat-table
        [dataSource]="productDetails"
        class="mat-elevation-z2 styled-table"
      >
        <!-- ID Column -->
        <ng-container matColumnDef="Id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let element">{{ element.productId }}</td>
        </ng-container>

        <!-- Product Name -->
        <ng-container matColumnDef="Product Name">
          <th mat-header-cell *matHeaderCellDef>Product Name</th>
          <td mat-cell *matCellDef="let element">
            <span class="product-name">{{ element.productName }}</span>
          </td>
        </ng-container>

        <!-- Description -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element" class="truncate">
            {{ getDescription(element.productDescription) }}
          </td>
        </ng-container>

        <!-- Discounted Price -->
        <ng-container matColumnDef="Product Discounted Price">
          <th mat-header-cell *matHeaderCellDef>Discounted Price</th>
          <td mat-cell *matCellDef="let element" class="price discounted">
            ₹{{ element.productDiscountedPrice }}
          </td>
        </ng-container>

        <!-- Actual Price -->
        <ng-container matColumnDef="Product Actual Price">
          <th mat-header-cell *matHeaderCellDef>Actual Price</th>
          <td mat-cell *matCellDef="let element" class="price actual">
            ₹{{ element.productActualPrice }}
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="Actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element" class="action-buttons">
            <button
              mat-icon-button
              color="primary"
              matTooltip="View Images"
              (click)="showImages(element)"
            >
              <mat-icon>image</mat-icon>
            </button>
            <button
              mat-icon-button
              color="accent"
              matTooltip="Edit Product"
              (click)="editProductDetails(element.productId)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              matTooltip="Delete Product"
              (click)="deleteProduct(element.productId)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="row-hover"
        ></tr>
      </table>

      <div class="text-center mt-4" *ngIf="showLoadMoreProductButton">
        <button
          type="button"
          mat-raised-button
          color="primary"
          (click)="loadMoreProduct()"
        >
          Load More
        </button>
      </div>
    </mat-card>
  </div>
</div>
