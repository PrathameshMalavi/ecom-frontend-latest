      <div class="w-100 d-flex justify-content-center py-4">
        <div
          class="table-responsive shadow-sm rounded"
          style="max-width: 600px; width: 100%"
        >
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light text-uppercase small">
              <tr>
                <th>Name</th>
                <th>Amount</th>
                <th style="width: 100px">Quantity</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let product of productDetails" class="fw-semibold">
                <td>{{ product.productName }}</td>
                <td>{{ product.productDiscountedPrice | currency : "INR" }}</td>
                <td>
                  <select
                    #quantity
                    class="form-select form-select-sm"
                    [ngModel]="getQuantityForProduct(product.productId)"
                    (change)="
                      onQuantityChanged(quantity.value, product.productId)
                    "
                    aria-label="Quantity"
                  >
                    <option *ngFor="let qty of [1, 2, 3]" [value]="qty">
                      {{ qty }}
                    </option>
                  </select>
                </td>
                <td>
                  {{
                    getCalculatedTotal(
                      product.productId,
                      product.productDiscountedPrice
                    ) | currency : "INR"
                  }}
                </td>
              </tr>
              <tr class="table-primary fw-bold">
                <td colspan="2"></td>
                <td>Total</td>
                <td>{{ getCalculatedGrandTotal() | currency }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div style="text-align: center; margin: 20px 0">
        <button
          style="
            width: 140px;
            border-radius: 12px;
            padding: 8px 0;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
          "
          onmouseover="this.style.backgroundColor='#0056b3'"
          onmouseout="this.style.backgroundColor='#007bff'"
