  <app-search-bar
    displayMsg="Search for products, brands and more..."
    (search)="searchByKeyword($event)"
  ></app-search-bar>

  @if(searchText == ""){
  <app-carousel-component></app-carousel-component>
  }

  <mat-grid-list cols="4" rowHeight="4:7" gutterSize="10">
    <mat-grid-tile *ngFor="let p of productDetails">
      <app-product-card
        [product]="p"
        [isInCart]="isProductInCart(p.productId)"
        (addToCart)="onAddToCart($event)"
      ></app-product-card>
    </mat-grid-tile>
  </mat-grid-list>

  <div
    class="text-center mt-5"
    style="padding-bottom: 100px"
    *ngIf="showLoadButton"
  >
    <button
      type="button"
      mat-raised-button
      color="primary"
      (click)="loadMoreProduct()"
    >
      Load more
    </button>
  </div>

  <div class="mt-5"></div>
  <div style="height: 50px"></div>
</div>
