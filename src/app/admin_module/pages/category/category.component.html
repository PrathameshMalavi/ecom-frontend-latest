<div *ngIf="loading">Loading categories...</div>
<div *ngIf="error" class="text-danger">{{ error }}</div>

<div *ngFor="let cat of categories$ | async" class="category-card">
  <!-- Left: Image -->
  <img
    *ngIf="cat.image?.base64"
    [src]="cat.image!.base64"
    alt="Category Image"
    class="category-image"
  />

  <!-- Middle: Name & Description -->
  <div class="category-info">
    <div class="category-name">{{ cat.name }}</div>
    <div class="category-desc">{{ cat.description }}</div>
  </div>

  <!-- Right: Actions Horizontal -->
  <div class="category-actions">
    <button (click)="viewCategory(cat)">
      <span class="material-icons">visibility</span>
      <span>View</span>
    </button>
    <button (click)="updateCategory(cat)">
      <span class="material-icons">edit</span>
      <span>Update</span>
    </button>
    <button (click)="deleteCategory(cat)">
      <span class="material-icons">delete</span>
      <span>Delete</span>
    </button>
  </div>
</div>

<div class="fab-rect-container">
  <button class="fab-rectangle" (click)="openAddCategoryDialog()">
    <span class="fab-rect-icon">
      <mat-icon style="font-size: 32px">add</mat-icon>
    </span>
    <span class="fab-rect-label">New Category</span>
  </button>
</div>
